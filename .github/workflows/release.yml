name: Build installer

# When a tag is pushed (git tag v1.2.0 && git push --tags) GitHub builds the installer from the public code,
# optionally signs it (when signing secrets are configured, see SIGNING.md), computes its SHA-256 and adds a
# verifiable build-provenance attestation.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the app
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1 customtkinter==5.2.2
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v -or $v -eq "main") { $v = "0.0.0" }
          Set-Content -Path assets/version.txt -Value $v -NoNewline
          $parts = ($v -split '\.') + @('0','0','0')
          (Get-Content assets/version_info.txt -Raw).Replace('@MAJ@',$parts[0]).Replace('@MIN@',$parts[1]).Replace('@PAT@',$parts[2]).Replace('@VER@',$v) | Set-Content -Path build_version_info.txt -Encoding utf8
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name MinecraftWorldDashboard `
            --icon assets/app.ico --version-file build_version_info.txt --collect-all customtkinter `
            --add-data "site/index.html;site" --add-data "site/lang;site/lang" `
            --add-data "assets/app.ico;." --add-data "assets/app_icon.png;." --add-data "assets/version.txt;." `
            --distpath dist_app --workpath build_tmp gui.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\setup.iss
      - name: Sign the installer (only when signing secrets are configured)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: installer/Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer/Output/MinecraftWorldDashboard-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MinecraftWorldDashboard-Setup.exe" | Out-File -Encoding ascii installer/Output/SHA256.txt
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: installer/Output/MinecraftWorldDashboard-Setup.exe
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer/Output/MinecraftWorldDashboard-Setup.exe installer/Output/SHA256.txt `
            --title "${{ github.ref_name }}" `
            --notes "Download MinecraftWorldDashboard-Setup.exe, run it and open Minecraft World Dashboard from your desktop. To verify it: gh attestation verify MinecraftWorldDashboard-Setup.exe --repo ${{ github.repository }} (or compare its SHA-256 with SHA256.txt)."
