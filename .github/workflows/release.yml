name: Build installer

# When a tag is pushed (git tag v1.2.0 && git push --tags) GitHub builds the installer from the public code,
# computes its SHA-256 and adds a
# verifiable build-provenance attestation.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the app
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}      # passed through the environment, never interpolated into the script
        run: |
          python -m pip install pyinstaller==6.11.1 customtkinter==5.2.2
          $v = $env:REF_NAME.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }   # branch builds (manual runs) get a placeholder version
          Set-Content -Path assets/version.txt -Value $v -NoNewline
          $parts = ($v -split '\.') + @('0','0','0')
          (Get-Content assets/version_info.txt -Raw).Replace('@MAJ@',$parts[0]).Replace('@MIN@',$parts[1]).Replace('@PAT@',$parts[2]).Replace('@VER@',$v) | Set-Content -Path build_version_info.txt -Encoding utf8
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name MinecraftWorldDashboard `
            --icon assets/app.ico --version-file build_version_info.txt --collect-all customtkinter `
            --add-data "site/index.html;site" --add-data "site/lang;site/lang" `
            --add-data "assets/app.ico;." --add-data "assets/app_icon.png;." --add-data "assets/version.txt;." `
            --distpath dist_app --workpath build_tmp gui.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\setup.iss
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer/Output/MinecraftWorldDashboard-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MinecraftWorldDashboard-Setup.exe" | Out-File -Encoding ascii installer/Output/SHA256.txt
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: installer/Output/MinecraftWorldDashboard-Setup.exe
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create $env:REF_NAME installer/Output/MinecraftWorldDashboard-Setup.exe installer/Output/SHA256.txt `
            --title $env:REF_NAME `
            --notes "Download MinecraftWorldDashboard-Setup.exe, run it and open Minecraft World Dashboard from your desktop. To verify it: gh attestation verify MinecraftWorldDashboard-Setup.exe --repo $env:REPO (or compare its SHA-256 with SHA256.txt)."
